<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>たんごシューティング2</title>
<style>
:root{--bg:#0a0f2e;--fg:#fff;--gold:#ffd447;--good:#5eead4;--bad:#ff7a93;--panel:#1a2160;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f2e;--fg:#fff}}
:root[data-theme="dark"]{--bg:#0a0f2e;--fg:#fff}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Yu Gothic",Meiryo,sans-serif}
#app{position:relative;height:100%;max-width:560px;margin:0 auto}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;font-weight:800;font-size:16px;pointer-events:none}
#qbox{position:absolute;top:40px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--panel);border:3px solid var(--gold);border-radius:22px;padding:6px 8px 6px 20px}
#word{font-size:40px;font-weight:900;letter-spacing:.02em;line-height:1.2}
#say{width:46px;height:46px;border-radius:50%;border:0;background:var(--gold);font-size:22px;cursor:pointer}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(8,12,38,.9);text-align:center;padding:24px}
.ov[hidden]{display:none}
.ov h1{margin:0;font-size:36px;font-weight:900;color:var(--gold)}
.ov p{margin:0;font-size:17px;line-height:1.7;max-width:20em}
.btn{font:inherit;font-size:22px;font-weight:900;padding:12px 34px;border:0;border-radius:999px;background:var(--gold);color:#1a1a40;cursor:pointer}
#miss{max-height:34vh;overflow-y:auto;font-size:15px;line-height:1.7;padding:8px 14px;background:var(--panel);border-radius:14px;width:min(100%,320px);text-align:left}
#miss:empty{display:none}
</style>
</head>
<body>
<div id="app">
<canvas id="c"></canvas>
<div class="hud"><span id="sc">スコア 0</span><span id="no"></span><span id="lv"></span></div>
<div id="qbox" hidden><div style="text-align:center"><div id="word"></div></div><button id="say" aria-label="おとをきく">🔊</button></div>
<div class="ov" id="ovStart">
<h1>たんご<br>シューティング</h1>
<p>えいごの たんごを きいて、その しゃしんの UFO を タップして うとう！<br>UFOは うえ・ひだり・みぎ から くるよ。<br>タップすると えいごで よみあげるよ。<br>まちがえたり、おちてきたら ライフが へるよ。</p>
<button class="btn" id="go">はじめる</button>
<button class="btn" id="snd" style="font-size:16px;padding:8px 22px;background:#fff">🔊 おとを ためす</button>
<p style="font-size:13px;opacity:.8">おとが でないときは、iPhone の よこの ミュート（サイレント）スイッチを オフに してね。</p>
</div>
<div class="ov" id="ovEnd" hidden>
<h1 id="endT"></h1>
<p id="endS"></p>
<div id="miss"></div>
<button class="btn" id="again">もういちど</button>
</div>
</div>

}catch(e){}}

function unlockAudio(){try{if(!sil){sil=new Audio('data:audio/wav;base64,UklGRsQPAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YaAPAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA');sil.loop=true;sil.setAttribute('playsinline','')}const p=sil.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
cv.addEventListener('pointerup',()=>{if(pendSay){const t=pendSay;pendSay=null;say(t)}});
$('snd').onclick=()=>{unlockAudio();say('apple')};
if(!window.speechSynthesis){const p=document.createElement('p');p.textContent='この ブラウザでは おとが でません。Safari や Chrome で ひらいてね。';p.style.fontSize='14px';$('ovStart').insertBefore(p,$('go'))}

let state='idle',deck=[],qi=0,cur=null,score=0,lives=3,combo=0,miss=[],enemies=[],bullets=[],parts=[],msg=null,tm=0,aim=-Math.PI/2,lastShot=0,time=0,last=0;
const stars=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),s:Math.random()*1.6+.4,v:Math.random()*22+8}));
let best=0;try{best=+localStorage.getItem('tango-best')||0}catch(e){}

function hud(){$('sc').textContent='スコア '+score;$('lv').textContent='❤️'.repeat(Math.max(lives,0));$('no').textContent=Math.min(qi+1,N)+' / '+N}
function startGame(){unlockAudio();clearTimeout(tm);fit();deck=shuffle(W).slice(0,N);qi=0;score=0;lives=3;combo=0;miss=[];enemies=[];bullets=[];parts=[];msg=null;
 $('ovStart').hidden=true;$('ovEnd').hidden=true;$('qbox').hidden=false;beep(520,.1);nextQ()}
function nextQ(){
 if(qi>=N)return finish(true);
 cur=deck[qi];
 const others=shuffle(W.filter(x=>x[0]!==cur[0]&&x[1]!==cur[1])).slice(0,3);
 const T=Math.max(8,16-qi*.4);
 const dirs=shuffle(['t','l','r',['t','l','r'][Math.floor(Math.random()*3)]]),slots=shuffle([0,1,2,3]),es=ES();
 enemies=shuffle([cur,...others]).map((o,i)=>{const d=dirs[i],j=Math.random()*70,tx=(slots[i]+.5)/4*w,ty=h-62-es/2;
  const sx=d==='l'?-es-j:d==='r'?w+es+j:tx+(Math.random()-.5)*w*.1,sy=d==='t'?-es-j:140+Math.random()*h*.2;
  const dx=tx-sx,dy=ty-sy,L=Math.hypot(dx,dy),v=L/T;
  return {en:o[0],ja:o[1],im:o[2][Math.floor(Math.random()*o[2].length)],ok:o===cur,x:sx,y:sy,vx:dx/L*v,vy:dy/L*v,col:COLS[i]}});
 $('word').textContent=cur[0];hud();say(cur[0]);state='play'}
const ex=e=>e.x;
const boom=(x,y,c)=>{for(let i=0;i<16;i++){const a=Math.random()*6.28,s=60+Math.random()*180;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.7,c})}};
const flash=(text,col)=>{msg={t:1.3,text,col}};
function addMiss(){if(!miss.includes(cur))miss.push(cur)}
function hit(e){
 boom(ex(e),e.y,e.ok?'#5eead4':'#ff7a93');
 if(e.ok){combo++;score+=10+Math.min(combo-1,4)*2;beep(660,.12);setTimeout(()=>beep(990,.18),90);
  flash(combo>1?'せいかい！ '+combo+'れんぞく':'せいかい！','#5eead4');enemies=[];qi++;state='wait';hud();tm=setTimeout(nextQ,800)}
 else{lives--;combo=0;addMiss();beep(150,.35,'sawtooth',.12);flash('ざんねん…','#ff7a93');enemies=enemies.filter(x=>x!==e);hud();if(lives<=0){state='wait';tm=setTimeout(()=>finish(false),700)}}}
function dropped(){
 lives--;combo=0;addMiss();beep(150,.35,'sawtooth',.12);flash('こたえは「'+cur[1]+'」','#ffd447');enemies=[];qi++;state='wait';hud();
 tm=setTimeout(()=>lives<=0?finish(false):nextQ(),1500)}
function finish(clear){try{sil.pause()}catch(e){}
 state='over';$('qbox').hidden=true;
 const right=N-miss.length;if(score>best){best=score;try{localStorage.setItem('tango-best',best)}catch(e){}}
 $('endT').textContent=clear?'ぜんぶ クリア！':'ゲームオーバー';
 const star=!clear?'':miss.length<=2?'⭐⭐⭐':miss.length<=6?'⭐⭐':'⭐';
 $('endS').textContent=(star?star+'　':'')+'スコア '+score+'　ベスト '+best+(clear?'':'　（'+Math.min(qi+1,N)+'もんめ）');
 $('miss').innerHTML=miss.length?'<b>まちがえた たんご</b><br>'+miss.map(m=>m[0]+' ＝ '+m[1]).join('<br>'):'';
 $('ovEnd').hidden=false;beep(clear?880:200,.4,clear?'sine':'triangle')}

cv.addEventListener('pointerdown',ev=>{
 if(state!=='play')return;const now=performance.now();if(now-lastShot<120)return;lastShot=now;
 const r=cv.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top,tx=w/2,ty=h-36;
 const tg=enemies.find(e=>Math.abs(x-ex(e))<ES()/2+18&&Math.abs(y-e.y)<ES()/2+18);pendSay=tg?tg.en:null;
 const dx=x-tx,dy=Math.min(y-ty,-30),d=Math.hypot(dx,dy);aim=Math.atan2(dy,dx);
 bullets.push({x:tx,y:ty-20,vx:dx/d*1000,vy:dy/d*1000,t:tg});beep(900,.07,'square',.04)});
$('go').onclick=startGame;$('again').onclick=startGame;$('say').onclick=()=>cur&&say(cur[0]);

function update(dt){
 time+=dt;stars.forEach(s=>{s.y+=s.v*dt/h;if(s.y>1)s.y=0});
 parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});parts=parts.filter(p=>p.l>0);
 if(msg){msg.t-=dt;if(msg.t<=0)msg=null}
 if(state!=='play')return;
 enemies.forEach(e=>{e.x+=e.vx*dt;e.y+=e.vy*dt});
 bullets.forEach(b=>{if(b.t&&enemies.includes(b.t)){const dx=ex(b.t)-b.x,dy=b.t.y-b.y,d=Math.hypot(dx,dy)||1;b.vx=dx/d*1000;b.vy=dy/d*1000}b.x+=b.vx*dt;b.y+=b.vy*dt});
 const ew=ES();
 for(const b of bullets){for(const e of enemies){if(Math.abs(b.x-ex(e))<ew/2+4&&Math.abs(b.y-e.y)<ew/2+4){b.dead=true;hit(e);break}}
  if(state!=='play')break}
 bullets=bullets.filter(b=>!b.dead&&b.y>-20&&b.x>-20&&b.x<w+20);
 if(state==='play'){const c=enemies.find(e=>e.ok);if(c&&c.y>h-62-ES()/2){boom(ex(c),c.y,'#ffd447');dropped()}}}

function rr(x,y,a,b,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,a,b,r):ctx.rect(x,y,a,b)}
function draw(){
 const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#0a0f2e');g.addColorStop(1,'#1d1650');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
 ctx.fillStyle='#fff';stars.forEach(s=>{ctx.globalAlpha=.4+s.s/3;ctx.fillRect(s.x*w,s.y*h,s.s,s.s)});ctx.globalAlpha=1;
 ctx.strokeStyle='rgba(255,122,147,.35)';ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(0,h-62);ctx.lineTo(w,h-62);ctx.stroke();ctx.setLineDash([]);
 const ew=ES();
 enemies.forEach(e=>{const x=ex(e),y=e.y,r=ew/2;
  ctx.fillStyle=e.col;rr(x-r-4,y-r-4,ew+8,ew+8,20);ctx.fill();
  ctx.save();rr(x-r,y-r,ew,ew,16);ctx.clip();ctx.fillStyle='#fff';ctx.fillRect(x-r,y-r,ew,ew);const m=IM[e.im];if(m.complete&&m.naturalWidth)ctx.drawImage(m,x-r,y-r,ew,ew);ctx.restore()});
 ctx.fillStyle='#ffd447';bullets.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,5,0,6.28);ctx.fill()});
 parts.forEach(p=>{ctx.globalAlpha=Math.max(p.l,0);ctx.fillStyle=p.c;ctx.fillRect(p.x-3,p.y-3,6,6)});ctx.globalAlpha=1;
 ctx.save();ctx.translate(w/2,h-36);ctx.rotate(aim+Math.PI/2);ctx.fillStyle='#ffd447';
 ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(17,16);ctx.lineTo(0,8);ctx.lineTo(-17,16);ctx.closePath();ctx.fill();ctx.restore();
 if(msg){ctx.globalAlpha=Math.min(msg.t*2,1);ctx.fillStyle=msg.col;ctx.font='900 28px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(msg.text,w/2,h*.5);ctx.globalAlpha=1}}

function loop(t){const dt=Math.min((t-last)/1000||0,.05);last=t;update(dt);draw();requestAnimationFrame(loop)}
fit();hud();requestAnimationFrame(loop);
</script>
</body>
