<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0f2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="たんごシューティング">
<title>たんごシューティング</title>
<style>
:root{--bg:#0a0f2e;--fg:#fff;--gold:#ffd447;--good:#5eead4;--bad:#ff7a93;--panel:#1a2160;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f2e;--fg:#fff}}
:root[data-theme="dark"]{--bg:#0a0f2e;--fg:#fff}
*{box-sizing:border-box}
html{height:100%;height:100dvh;scroll-padding-top:env(safe-area-inset-top,0px);overscroll-behavior:none;background:var(--bg)}
body{height:100%;height:100dvh;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Yu Gothic",Meiryo,sans-serif}
#app{position:relative;height:100%;height:100dvh;width:100%;max-width:720px;margin:0 auto;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;font-weight:800;font-size:16px;pointer-events:none}
#qbox{position:absolute;top:40px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--panel);border:3px solid var(--gold);border-radius:22px;padding:6px 8px 6px 20px}
#word{font-size:40px;font-weight:900;letter-spacing:.02em;line-height:1.2}
#say{width:48px;height:48px;min-width:48px;min-height:48px;border-radius:50%;border:0;background:var(--gold);font-size:22px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(8,12,38,.9);text-align:center;padding:24px}
.ov[hidden]{display:none}
.ov h1{margin:0;font-size:36px;font-weight:900;color:var(--gold)}
.ov p{margin:0;font-size:17px;line-height:1.7;max-width:20em}
.btn{font:inherit;font-size:22px;font-weight:900;min-height:52px;padding:12px 34px;border:0;border-radius:999px;background:var(--gold);color:#1a1a40;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#miss{max-height:34vh;overflow-y:auto;font-size:15px;line-height:1.7;padding:8px 14px;background:var(--panel);border-radius:14px;width:min(100%,320px);text-align:left}
#miss:empty{display:none}

@media (max-width:480px){.hud{top:max(8px,env(safe-area-inset-top));font-size:14px;padding:0 10px}#qbox{top:max(38px,calc(env(safe-area-inset-top) + 34px));max-width:calc(100% - 20px);padding:6px 7px 6px 14px}#word{font-size:clamp(28px,9vw,40px)}#wja{font-size:13px!important}.ov{padding:20px max(18px,env(safe-area-inset-left)) max(20px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-right))}.ov h1{font-size:clamp(30px,10vw,36px)}.ov p{font-size:16px}}
@media (min-width:768px){#app{max-width:760px}#word{font-size:44px}.hud{font-size:18px}}
@media (orientation:landscape) and (max-height:520px){#qbox{top:34px}#word{font-size:30px}.ov{gap:8px;padding:12px 24px}.ov h1{font-size:28px}.ov p{font-size:14px;line-height:1.45}.btn{min-height:44px;padding:8px 28px;font-size:19px}#miss{max-height:28vh}}
button{font-family:inherit}button:focus-visible{outline:4px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<div id="app">
<canvas id="c" aria-label="たんごシューティング ゲーム画面"></canvas>
<div class="hud"><span id="sc">スコア 0</span><span id="no"></span><span id="lv"></span></div>
<div id="qbox" hidden><div style="text-align:center"><div id="word"></div><div id="wja" style="font-size:15px;opacity:.85"></div></div><button id="say" aria-label="おとをきく">🔊</button></div>
<div class="ov" id="ovStart">
<h1>たんご<br>シューティング</h1>
<p>えいごの たんごを きいて、その しゃしんの UFO を タップして うとう！<br>タップすると えいごで よみあげるよ。<br>まちがえたり、おちてきたら ライフが へるよ。</p>
<button class="btn" id="go">はじめる</button>
</div>
<div class="ov" id="ovEnd" hidden>
<h1 id="endT"></h1>
<p id="endS"></p>
<div id="miss"></div>
<button class="btn" id="again">もういちど</button>
</div>
</div>

cv.addEventListener('pointerdown',ev=>{
 if(state!=='play')return;const now=performance.now();if(now-lastShot<120)return;lastShot=now;
 const r=cv.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top,tx=w/2,ty=h-36;
 const tg=enemies.find(e=>Math.abs(x-ex(e))<ES()/2+10&&Math.abs(y-e.y)<ES()/2+10);if(tg)say(tg.en);
 const dx=x-tx,dy=Math.min(y-ty,-30),d=Math.hypot(dx,dy);aim=Math.atan2(dy,dx);
 bullets.push({x:tx,y:ty-20,vx:dx/d*1000,vy:dy/d*1000,t:tg});beep(900,.07,'square',.04)});
$('go').onclick=startGame;$('again').onclick=startGame;$('say').onclick=()=>cur&&say(cur[0]);

function update(dt){
 time+=dt;stars.forEach(s=>{s.y+=s.v*dt/h;if(s.y>1)s.y=0});
 parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});parts=parts.filter(p=>p.l>0);
 if(msg){msg.t-=dt;if(msg.t<=0)msg=null}
 if(state!=='play')return;
 enemies.forEach(e=>e.y+=e.vy*dt);
 bullets.forEach(b=>{if(b.t&&enemies.includes(b.t)){const dx=ex(b.t)-b.x,dy=b.t.y-b.y,d=Math.hypot(dx,dy)||1;b.vx=dx/d*1000;b.vy=dy/d*1000}b.x+=b.vx*dt;b.y+=b.vy*dt});
 const ew=ES();
 for(const b of bullets){for(const e of enemies){if(Math.abs(b.x-ex(e))<ew/2+4&&Math.abs(b.y-e.y)<ew/2+4){b.dead=true;hit(e);break}}
  if(state!=='play')break}
 bullets=bullets.filter(b=>!b.dead&&b.y>-20&&b.x>-20&&b.x<w+20);
 if(state==='play'){const c=enemies.find(e=>e.ok);if(c&&c.y>h-62-ES()/2){boom(ex(c),c.y,'#ffd447');dropped()}}}

function rr(x,y,a,b,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,a,b,r):ctx.rect(x,y,a,b)}
function draw(){
 const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#0a0f2e');g.addColorStop(1,'#1d1650');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
 ctx.fillStyle='#fff';stars.forEach(s=>{ctx.globalAlpha=.4+s.s/3;ctx.fillRect(s.x*w,s.y*h,s.s,s.s)});ctx.globalAlpha=1;
 ctx.strokeStyle='rgba(255,122,147,.35)';ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(0,h-62);ctx.lineTo(w,h-62);ctx.stroke();ctx.setLineDash([]);
 const ew=ES();
 enemies.forEach(e=>{const x=ex(e),y=e.y,r=ew/2;
  ctx.fillStyle=e.col;rr(x-r-4,y-r-4,ew+8,ew+8,20);ctx.fill();
  ctx.save();rr(x-r,y-r,ew,ew,16);ctx.clip();ctx.fillStyle='#fff';ctx.fillRect(x-r,y-r,ew,ew);const m=IM[e.im];if(m.complete&&m.naturalWidth)ctx.drawImage(m,x-r,y-r,ew,ew);ctx.restore()});
 ctx.fillStyle='#ffd447';bullets.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,5,0,6.28);ctx.fill()});
 parts.forEach(p=>{ctx.globalAlpha=Math.max(p.l,0);ctx.fillStyle=p.c;ctx.fillRect(p.x-3,p.y-3,6,6)});ctx.globalAlpha=1;
 ctx.save();ctx.translate(w/2,h-36);ctx.rotate(aim+Math.PI/2);ctx.fillStyle='#ffd447';
 ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(17,16);ctx.lineTo(0,8);ctx.lineTo(-17,16);ctx.closePath();ctx.fill();ctx.restore();
 if(msg){ctx.globalAlpha=Math.min(msg.t*2,1);ctx.fillStyle=msg.col;ctx.font='900 28px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(msg.text,w/2,h*.5);ctx.globalAlpha=1}}

function loop(t){const dt=Math.min((t-last)/1000||0,.05);last=t;update(dt);draw();requestAnimationFrame(loop)}
fit();hud();requestAnimationFrame(loop);

// 学校端末向け: 長押しメニューによる誤操作を抑える
document.addEventListener('contextmenu', e => e.preventDefault());
</script>
